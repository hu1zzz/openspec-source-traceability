# 源需求状态类型：
#
# pending：已识别，尚未分析或映射到 Spec。
# mapped：已完整映射到一个或多个 Spec Requirement。
# partial：仅部分内容映射到 Spec；必须填写 uncovered 和 reason。
# excluded：经明确决策不纳入当前变更；必须填写 reason，建议填写 decision。
# not-applicable：不属于当前 change 的范围；必须填写 reason。
# conflict：原始需求之间或需求与现有设计存在冲突，尚未解决；必须填写 reason。
#
# 映射规则：
# 1. 本文件只登记相对当前主规范新增或 Revision 发生变化的需求。
# 2. 主规范 sources 中相同 ID、相同 Revision 的需求已覆盖，无需复制。
# 3. 主规范未覆盖且本次未登记的需求不得静默遗漏。
# 4. mapped 必须至少关联一个 specs 条目，且每个 acceptancePoints 条目均为 mapped。
# 5. pending 和 conflict 表示需求转换尚未完成。
# 6. partial、excluded、not-applicable 必须填写 reason。
# 7. Spec Requirement 使用稳定 REQ-* ID，标题修改不得改变 ID。
# 8. Spec 中的 sources 与本文件中的 specs 必须保持双向一致。
# 9. 没有直接源需求的派生 Spec 应在 Spec 中标记 origin: derived，不得虚构来源。
# 10. 本文件在 Spec 生成前建立增量基线，并在 Spec 生成后回写映射结果。

source:
  document: "<需求文档路径或名称>"
  revision: "<需求文档版本>"
  sha256: "<可选：需求文档 SHA-256>"

requirements:
  - id: "<原始需求 ID；无 ID 时使用 SRC-001>"
    revision: "<原始需求修订号；无修订号时删除本字段>"
    changeType: "<added 或 modified>"
    previousRevision: "<仅 modified 时填写历史修订号>"
    title: "<原始需求标题>"
    status: pending
    specs: []
    acceptancePoints:
      - id: "<ACP-来源ID-001>"
        text: "<一项可独立验收的接口、字段、筛选、状态或约束>"
        status: pending
        specs: []
        scenarios: []
